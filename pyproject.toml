[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mios"
version = "0.2.0"
description = "Macro Intelligence Operating System — a research infrastructure for forecasting US/Japan macro releases and interpreting Gold and USDJPY"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    # CONSTITUTION.md Art.8: minimal dependencies. Every addition needs an ADR.
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "psycopg[binary]>=3.2",  # ADR-009 driver, ADR-010 managed PostgreSQL
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "UP",        # pyupgrade
    "N",         # pep8-naming
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "DTZ",       # naive-datetime ban (known_at discipline depends on tz-aware times)
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # MIOS emits Japanese text; fullwidth punctuation is intended
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ001"]  # tests may build naive datetimes to assert they are rejected

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["mios"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]
