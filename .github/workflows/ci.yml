# Quality gate. Mirrors `make check`, plus the integration tests that skip
# locally when PostgreSQL is absent: the append-only triggers and schema
# constraints are load-bearing, so CI is where they actually get exercised
# (docs/REPOSITORY_AUDIT.md §15 V-5, V-6).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mios_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIOS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mios_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Typecheck
        run: mypy

      - name: Test
        run: pytest

      - name: Fail if integration tests were skipped
        # A green run that silently skipped the DB tests is a false green.
        run: |
          pytest tests/integration -q --no-header -rs 2>&1 | tee /tmp/integration.log
          if grep -q "SKIPPED" /tmp/integration.log; then
            echo "::error::integration tests skipped in CI — the PostgreSQL service is not reachable"
            exit 1
          fi
