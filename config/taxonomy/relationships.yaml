# Relationship taxonomy: three edge classes.

# Class A: entity-entity, slowly changing.
entity_entity:
  publishes: "Agency publishes an indicator (BLS publishes CPI)"
  sets_policy_for: "Central bank sets policy for a currency/country"
  member_of: "Person sits on a committee (FOMC, BOJ Policy Board)"
  located_in: "Jurisdiction"
  denominated_in: "Asset quoted in a currency"
  forecasts: "Institution publishes forecasts for an indicator"

# Class B: event-entity participation roles. Verbs are event types plus
# these roles, never static edges.
participation_roles:
  actor: "Who acted or published"
  subject: "What the event is about (the indicator, the asset)"
  affected: "Materially affected party"
  venue: "Where it happened"
  mentioned: "Weak involvement, mention only"

# Class C: event-event edges. TRIGGERED_BY requires evidence + confidence
# (enforced by a DB constraint). PRECEDES is never a causal claim.
event_event:
  TRIGGERED_BY: "Direct causal trigger (evidence mandatory)"
  CAUSED_BY_BG: "Structural background cause"
  PART_OF: "Belongs to a chain"
  PRECEDES: "Temporal order only — no causal claim"
  SIMILAR_TO: "Historical analog"
  INVALIDATES: "Correction, revision or retraction of an earlier print"
  REVISES: "A later vintage of the same release"
  AMPLIFIES: "Concurrent event amplifying impact"
  OFFSETS: "Concurrent event offsetting impact"
