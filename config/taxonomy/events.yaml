# Event type taxonomy. domain.category.type — exactly 3 levels.
# Adding a type = one line here (no code change). Removal/renaming needs an ADR.
#
# An "event" here is something that happened and is now known: a data
# release, a policy decision, a statement. Scheduled *future* releases are
# not events — they live in the economic calendar, because an event's
# known_at can never precede its occurrence by more than a day
# (docs/REPOSITORY_AUDIT.md §4.1 problem C).
types:
  # release — a statistical agency published a number
  - release.us_inflation.cpi
  - release.us_inflation.core_cpi
  - release.us_inflation.ppi
  - release.us_inflation.pce
  - release.us_inflation.core_pce
  - release.us_inflation.import_prices
  - release.us_employment.nfp
  - release.us_employment.unemployment_rate
  - release.us_employment.average_hourly_earnings
  - release.us_employment.jolts
  - release.us_employment.initial_claims
  - release.us_employment.continuing_claims
  - release.us_employment.adp
  - release.us_employment.challenger
  - release.us_growth.retail_sales
  - release.us_growth.industrial_production
  - release.us_growth.durable_goods
  - release.us_growth.housing
  - release.us_growth.ism_manufacturing
  - release.us_growth.ism_services
  - release.us_growth.consumer_confidence
  - release.us_growth.gdp
  - release.jp_inflation.cpi
  - release.jp_inflation.core_cpi
  - release.jp_employment.wages
  - release.jp_employment.unemployment_rate
  - release.jp_growth.tankan
  - release.jp_growth.gdp
  # A release the provider's calendar carries that MIOS has not
  # categorised. It still belongs on the calendar — "something is out
  # today" is information — but pretending to know which category it
  # falls in would be worse than saying it is uncategorised.
  - release.other.uncategorised
  # policy — a central bank decided or signalled something
  - policy.fed.rate_decision
  - policy.fed.statement
  - policy.fed.minutes
  - policy.fed.projections
  - policy.fed.speech
  - policy.boj.rate_decision
  - policy.boj.statement
  - policy.boj.outlook_report
  - policy.boj.speech
  - policy.boj.intervention
  - policy.treasury.refunding
  - policy.mof.intervention
  # market — a price or yield did something that needs explaining
  - market.rates.curve_shift
  - market.rates.real_yield_shift
  - market.fx.sharp_move
  - market.gold.sharp_move
  - market.risk.shock
  # forecast — someone published or changed a published forecast
  - forecast.institution.published
  - forecast.institution.revised
  - forecast.consensus.shift
  # macro context — everything that moves the backdrop
  - context.fiscal.action
  - context.trade.action
  - context.geopolitics.escalation
  - context.geopolitics.deescalation
  - context.china.policy
  - context.energy.supply_shock
