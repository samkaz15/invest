# Entity kinds (MASTER_SYSTEM_DESIGN §5.3). Adding a kind = one line here.
kinds:
  asset: "Tradable asset (BTC is one instance; equities/FX/commodities later)"
  token: "Crypto token relevant only insofar as it affects tracked assets"
  stablecoin: "Pegged token (issuer, collateral, peg status)"
  blockchain: "A network (consensus, hashrate metrics)"
  wallet_cluster: "Attributed address group (owner, tracked balance)"
  exchange: "Trading venue, spot or derivatives"
  etf: "Exchange-traded fund holding a tracked asset"
  fund: "Investment fund / asset manager"
  company: "Corporate (treasury holder, miner parent, etc.)"
  bank: "Bank with crypto exposure or systemic relevance"
  custodian: "Custody provider"
  miner: "Mining company or attributed miner cluster"
  government: "National/state government (holdings, policy actor)"
  regulator: "Regulatory agency (SEC, CFTC, FSA...)"
  central_bank: "Monetary authority (Fed, ECB, BoJ)"
  court: "Court of law"
  legal_case: "Long-running legal proceeding (parties, status)"
  country: "Country as jurisdiction / adopter"
  person: "Natural person (executives, politicians, founders)"
  economic_indicator: "Recurring macro data series (CPI, NFP...)"
  regulation: "A specific law or rule referenced by events (MiCA...)"
  protocol: "On-chain protocol (Lightning, DeFi)"
  media_outlet: "News source (ties into source registry tiers)"
