# Entity kinds. Adding a kind = one line here.
kinds:
  asset: "An analysed asset (XAUUSD, USDJPY) — configuration, not a code assumption"
  economic_indicator: "A recurring published series (CPI, NFP, PCE...)"
  central_bank: "Monetary authority (Federal Reserve, BOJ, ECB)"
  statistical_agency: "Publisher of official statistics (BLS, BEA, Census, e-Stat)"
  government: "National or state government as fiscal/policy actor"
  finance_ministry: "Treasury / MOF — issuance, intervention"
  regulator: "Regulatory agency"
  institution: "Bank or research house publishing forecasts (Goldman Sachs, Nomura...)"
  person: "Natural person (FOMC members, BOJ board, ministers)"
  country: "Country as jurisdiction"
  currency: "A currency (USD, JPY)"
  commodity: "A commodity (gold, oil, copper)"
  media_outlet: "News source; ties into the source registry tiers"
