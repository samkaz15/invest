# 手入力のコンセンサス予想。Tier 3、取得は行わない。
#
# **なぜ自動取得しないのか。** NFP と失業率の月次コンセンサスは、MIOS が
# 唯一ベンチマークを持てていないデータである（ADR-012）。外為どっとコムなどの
# カレンダーには「予想」列があり、そこに答えがある。しかしその数値はほぼ確実に
# データベンダーからライセンスを受けたものであり、ブローカーのサイトから自動取得して
# 公開リポジトリにコミットすることは**再配布**にあたる。規約上も設計上も行わない。
#
# 人が自分の目で読んで書き写すのは、そのサイトの本来の使い方である。
# だからこの経路が存在する：入力は `input/consensus.csv`、取り込みは `mios consensus`。
#
# 保存されるのは他の予測とまったく同じ扱いで、**上書きされない**。
# 発表10日前に書き写した予想は、発表前日に書き直しても消えない。
# 出典URLと「いつ書き写したか」が行ごとに必須。
source_id: src_manual_consensus
name: コンセンサス予想（手入力）
kind: manual
url: https://www.gaikaex.com/gaikaex/mark/calendar/
tier: 3
enabled: false
notes: >-
  Tier 3 のため単独で数値の根拠にしない（憲法第4条）。あくまで MIOS 自身の予測を
  測るための比較対象であり、観測値としては扱わない。入力方法は input/README.md。
