# Whose forecasts MIOS is measured against.
#
# `forecast_errors` answers "did the drivers beat doing nothing?". That is
# the right first question and a low bar — the naive baseline is beaten
# routinely by anyone paying attention. The question that decides whether
# this project was worth building is whether it beat what was already
# publicly known, for free, on the same morning.
#
# Which means the honest scoreboard needs a third column, and this file says
# where it comes from.

# ---------------------------------------------------------------------------
# What no free institutional forecast covers.
#
# This list is required and cannot be empty, for the same reason every macro
# score must declare its blind spots: a scoreboard showing two of four
# targets reads as a complete scoreboard unless it says otherwise.
#
# Payrolls and the unemployment rate are here because the monthly consensus
# for them — the Bloomberg and Reuters economist surveys — is a commercial
# product, and no central bank publishes a monthly forecast of the print.
# The Fed's SEP and the Philadelphia Fed's SPF both cover unemployment, but
# as quarterly or Q4/Q4 projections; neither is a forecast of "the August
# payrolls figure", so scoring MIOS against them would be scoring it against
# a different question and reporting the result as though it were this one.
#
# The consequence is worth stating plainly rather than discovering later:
# for the labour-market half of MIOS, the naive baseline is the only
# benchmark there is, and a good skill number there means less than the same
# number on CPI.
uncovered:
  - ser_us_nfp_level
  - ser_us_unemployment_rate

providers:
  - provider_id: src_clevelandfed_nowcast
    label: Cleveland Fed
    parser: clevelandfed_nowcast_csv
    source_url: https://www.clevelandfed.org/indicators-and-data/inflation-nowcasting
    method: >-
      A daily-updated nowcast built from a small dynamic factor model over
      oil prices, gasoline, and the term structure of inflation
      expectations. Published for the current and following month, so it is
      available well before the print MIOS is forecasting.
    targets:
      - target_series_id: ser_us_core_cpi_index
        # The column name in the published CSV. UNVERIFIED — a wrong value
        # fails at parse time with the real column list in the message.
        provider_code: "Core CPI"
        raw_unit: percent_mom
        # Published in percent (0.28 meaning 0.28%); MIOS forecasts
        # pct_change as a fraction. Without this the comparison would report
        # the Cleveland Fed as wrong by two orders of magnitude.
        scale: 0.01
      - target_series_id: ser_us_cpi_index
        provider_code: "CPI"
        raw_unit: percent_mom
        scale: 0.01
