# The registry of every time series MIOS tracks.
#
# This file is the source of truth; `mios migrate` syncs it into the
# `series` table so observations can carry a foreign key.
#
# `parser` names the payload reader (src/mios/series/parsers.py), NOT the
# provider: FRED, Treasury and the price vendor each have one payload shape,
# and a series only has to say which shape its source speaks.
#
# `revisable: true` means the publisher restates past values. Reading such a
# series without an as-of filter is a look-ahead bug, and the repository
# refuses to do it (CONSTITUTION.md Art.6).
#
# 日本の系列は1つも無い。JGB は MOF が文字コードを宣言せず、CPI・賃金は
# e-Stat が専用の reader を要する。いずれも「機関ごとに個別対応」という
# 種類の作業で、収集の難所がそこに集中していたため、2026-09-16 に対象外と
# 決めた（docs/adr/ADR-015）。
#
# 結果として **USDJPY の見方は米国側だけで構成される**。これは弱点であり、
# config/analysis.yaml の usdjpy_bias が blind_spots として毎日明示する。
#
# The `_vintage` series are the same numbers pulled from ALFRED, which
# reports when each figure became public. They are separate series rather
# than a flag because they are a different observation of the world: the
# plain series answers "what is it now", the vintage series answers "what
# was it said to be, and when".
series:
  - series_id: ser_us_cpi_index
    name: "US CPI, all items (index)"
    country: US
    category: inflation
    unit: index
    frequency: monthly
    source_id: src_fred_cpiaucsl
    provider_code: "CPIAUCSL"
    parser: fred_json
    revisable: true
    seasonal_adjustment: sa
    notes: >-
      Headline CPI level. YoY/MoM are derived, never stored as a separate fetched series.
