# Scheduled jobs. Macro data moves on publication calendars, not on ticks:
# daily series are polled a few times a day, monthly series hourly around
# their release window. Driven by `mios run-due`.
defaults:
  retry_delays_seconds: [60, 300, 1800]
  retry_jitter: 0.1
  breaker_failure_threshold: 3
  breaker_cooldown_minutes: 360

jobs:
  - { job_id: collect_fred_cpi, task: collect, source_id: src_fred_cpi, interval_minutes: 360 }
  - { job_id: collect_fred_dgs2, task: collect, source_id: src_fred_dgs2, interval_minutes: 360 }
  - { job_id: collect_fred_dgs10, task: collect, source_id: src_fred_dgs10, interval_minutes: 360 }
  - { job_id: collect_td_xauusd, task: collect, source_id: src_twelvedata_xauusd, interval_minutes: 360 }
  - { job_id: collect_td_usdjpy, task: collect, source_id: src_twelvedata_usdjpy, interval_minutes: 360 }
