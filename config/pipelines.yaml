# Scheduled jobs. Macro data moves on publication calendars, not on ticks:
# nothing here needs to be polled more often than a few times a day, and
# polling faster only burns the providers' rate limits.
#
# `mios run-due` runs whatever is due; GitHub Actions calls it (Phase 10).
defaults:
  retry_delays_seconds: [60, 300, 1800]
  retry_jitter: 0.1
  breaker_failure_threshold: 3
  breaker_cooldown_minutes: 360

jobs:
  - { job_id: collect_cpiaucsl, task: collect, source_id: src_fred_cpiaucsl, interval_minutes: 720 }
  - { job_id: collect_cpilfesl, task: collect, source_id: src_fred_cpilfesl, interval_minutes: 720 }
