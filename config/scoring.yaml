# Macro dimension weights. Every score card records `weights_version`, so a
# card computed today stays interpretable after the weights change.
#
# v1 is deliberately equal-weight: there is no evidence yet for any other
# choice, and a tuned weight without evidence is a number nobody can defend.
# Changing a weight requires backtest evidence plus an ADR.
weights_version: w_macro_v1

weight_sets:
  # Used until the regime classifier exists (Phase 7).
  default:
    growth: 1.0
    inflation: 1.0
    labor: 1.0
    fed: 1.0
    boj: 1.0
    rates: 1.0
    fx: 1.0
    risk: 1.0
